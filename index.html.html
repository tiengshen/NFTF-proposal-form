<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Information Form</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mut:#5d6b7c;--line:#d9e0e8;--brand:#b3202a;--brand2:#8d1820;--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",sans-serif;padding-bottom:90px}
header{background:var(--brand);color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12.5px;opacity:.92}
.bar{height:5px;background:#e6c4c7}.bar i{display:block;height:100%;background:#fff;width:0;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--line);color:var(--brand2)}
h3:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.zh{display:block;color:var(--mut);font-size:12.5px;font-weight:400}
.note{background:#fff7e0;border:1px solid #f0dc9a;border-radius:8px;padding:9px 11px;font-size:13.5px;margin:8px 0}
label.f{display:block;margin:10px 0 0;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;margin-top:4px;padding:11px 10px;border:1px solid #c3ccd6;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input[readonly]{background:#eef1f4}
textarea{min-height:64px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips label{margin:0;font-weight:500;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:8px 14px;border:1.5px solid #c3ccd6;border-radius:999px;font-size:14px;background:#fff}
.chips input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.chips input[value=No]:checked+span{background:var(--ok);border-color:var(--ok)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qt{font-size:14.5px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.who{min-width:64px;font-size:12.5px;color:var(--mut);font-weight:700}
.det{margin-top:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;font-weight:500}
.chk input{margin-top:4px;width:20px;height:20px;flex:none}
.sigbox{border:1.5px dashed #8896a6;border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--brand);color:#fff}.btn.s{background:#e8edf2;color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;z-index:5}
.nav .btn{flex:1}
.small{font-size:12.5px;color:var(--mut)}
.who2{display:inline-block;background:#eef1f4;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--brand2);margin-bottom:4px}
.ok{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Client Information Form · 客户资料表</h1>
  <p>Hiew Tieng Shen 丘廷升 · Life Insurance Advisor 人寿保险顾问 · Great Eastern Life Assurance (Malaysia) Berhad</p>
</header>
<div class="bar"><i id="prog"></i></div>
<main id="app"></main>
<div class="nav"><button class="btn s" id="back">← Back 返回</button><button class="btn p" id="next">Next 下一步 →</button></div>

<script>
/* ---------- state ---------- */
var ADVISOR_WA='60163388362'; /* advisor WhatsApp number, digits only with country code, e.g. 60123456789 */
var KEY='clientinfo_v1';
var S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var REG=[];
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var L=function(en,zh){return esc(en)+(zh?'<small class="zh">'+esc(zh)+'</small>':'')};
function sec(t,zh){REG.push({h:t});return '<h3>'+L(t,zh)+'</h3>'}
function inp(n,en,zh,type,ph,rr){REG.push({n:n,l:en});return '<label class="f">'+L(en,zh)+'<input data-n="'+n+'" type="'+(type||'text')+'" value="'+esc(S[n])+'" placeholder="'+esc(ph||'')+'"'+(rr?' data-rr="1"':'')+'></label>'}
function sel(n,en,zh,opts,rr){REG.push({n:n,l:en});var o='<option value="">— select 选择 —</option>'+opts.map(function(x){return '<option'+(S[n]===x?' selected':'')+'>'+esc(x)+'</option>'}).join('');return '<label class="f">'+L(en,zh)+'<select data-n="'+n+'"'+(rr?' data-rr="1"':'')+'>'+o+'</select></label>'}
function rad(n,en,zh,opts,rr){REG.push({n:n,l:en});return '<div class="f" style="margin-top:10px"><b style="font-size:14px">'+L(en,zh)+'</b><div class="chips">'+opts.map(function(x){return '<label><input type="radio" name="'+n+'" data-n="'+n+'" value="'+esc(x)+'"'+(S[n]===x?' checked':'')+(rr?' data-rr="1"':'')+'><span>'+esc(x)+'</span></label>'}).join('')+'</div></div>'}
function chk(n,en,zh,rr){REG.push({n:n,l:en,c:1});return '<label class="chk"><input type="checkbox" data-n="'+n+'"'+(S[n]?' checked':'')+(rr?' data-rr="1"':'')+'><span>'+L(en,zh)+'</span></label>'}
function txt(n,en,zh,ph){REG.push({n:n,l:en});return '<label class="f">'+L(en,zh)+'<textarea data-n="'+n+'" placeholder="'+esc(ph||'')+'">'+esc(S[n])+'</textarea></label>'}

var PEOPLE=[['A','Life A – Life to be Assured','Life A – 受保人'],['B','Life B – Proposer (policy owner)','Life B – 投保人（保单持有人）'],['C','Life C – Mother / Spouse of Proposer','Life C – 投保人的母亲/配偶']];
function active(){return PEOPLE.filter(function(p){return p[0]==='A'||(p[0]==='B'&&S.hasB)||(p[0]==='C'&&S.hasC)})}
function pname(c){return {A:'Life A',B:'Life B',C:'Life C'}[c]}
function ageNext(dob){if(!dob)return '';var d=new Date(dob),n=new Date();if(isNaN(d))return '';var a=n.getFullYear()-d.getFullYear();var m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a+1}
function isChild2(){var d=new Date(S.A_dob);if(!S.A_dob||isNaN(d))return false;return (Date.now()-d)/31557600000<=2}

function yn(id,en,zh,ps,ph){
  var h='<div class="q"><div class="qt">'+L(en,zh)+'</div>';
  ps.forEach(function(p){
    var n='q_'+id+'_'+p, v=S[n], dn='d_'+id+'_'+p;
    REG.push({n:n,l:(ps[0]==='*'?'':pname(p)+' – ')+en});
    REG.push({n:dn,l:'   Details',d:1});
    h+='<div class="row">'+(p==='*'?'':'<span class="who">'+pname(p)+'</span>')+'<div class="chips" style="margin:0">'+
    ['Yes','No'].map(function(x){return '<label><input type="radio" name="'+n+'" data-n="'+n+'" data-yn="'+dn+'" value="'+x+'"'+(v===x?' checked':'')+'><span>'+(x==='Yes'?'Yes 是':'No 否')+'</span></label>'}).join('')+'</div></div>'+
    '<textarea class="det" id="'+dn+'" data-n="'+dn+'" placeholder="'+esc(ph||'If Yes, please give full details 如回答“是”，请提供详情')+'"'+(v==='Yes'?'':' hidden')+'>'+esc(S[dn])+'</textarea>';
  });
  return h+'</div>';
}

/* ---------- person details ---------- */
function person(p){
  var c=p[0],h='<div class="card"><span class="who2">'+p[1]+'</span>';
  h+=sec('Personal details','个人资料');
  h+=sel(c+'_title','Title','称谓',['Mr','Madam','Miss','Others']);
  h+=inp(c+'_name','Full name (as shown on NRIC)','全名（与身份证相同）');
  h+='<div class="grid">'+inp(c+'_nric','New NRIC No.','新身份证号码','text','e.g. 900101-14-1234')+inp(c+'_other_id','Birth Cert / Passport / ROC No.','出生证/护照/公司注册号')+'</div>';
  h+=inp(c+'_ppexp','Passport expiry date (if applicable)','护照有效期（如适用）','date');
  h+=inp(c+'_dob','Date of birth','出生日期','date');
  S[c+'_age']=ageNext(S[c+'_dob']);REG.push({n:c+'_age',l:'Age next birthday'});
  h+='<label class="f">'+L('Age next birthday','下一个生日年龄')+'<input id="age_'+c+'" readonly value="'+esc(S[c+'_age'])+'"></label>';
  h+=rad(c+'_sex','Sex','性别',['Male','Female']);
  h+=rad(c+'_nat','Nationality','国籍',['Malaysian','Others'],1);
  if(S[c+'_nat']==='Others'){h+=inp(c+'_natc','State country','请注明国家');h+=rad(c+'_pr','Malaysian PR?','马来西亚永久居民？',['Yes','No'])}
  h+=inp(c+'_cob','Country of birth','出生国家');
  h+=rad(c+'_race','Race','种族',['Malay','Chinese','Indian','Others']);
  h+=rad(c+'_rel','Religion','宗教',['Islam','Others']);
  h+=rad(c+'_mar','Marital status','婚姻状况',['Single','Married','Divorced','Widowed']);
  h+='<div class="grid">'+inp(c+'_kids','No. of children','子女人数','number')+'<span></span>'+inp(c+'_ht','Height (cm)','身高（厘米）','number')+inp(c+'_wt','Weight (kg)','体重（公斤）','number')+'</div>';
  h+=inp(c+'_email','Email','电邮','email');
  if(c==='A'){h+=rad('A_pren','Is Life to be Assured at prenatal stage?','受保人是否处于产前阶段？',['Yes','No'],1);if(S.A_pren==='Yes')h+=inp('A_edd','Expected due date','预产期','date')}
  if(c!=='B')h+=sel(c+'_relprop','Relationship with Proposer','与投保人的关系',['Child','Spouse','Employee','Ward','Others','Same person (I am the proposer)']);
  h+=sec('Occupation / self-employed details','职业/自雇资料');
  h+=inp(c+'_occ','Occupation','职业');
  h+=inp(c+'_ind','Industry','行业');
  h+=inp(c+'_work','Exact nature of work','具体工作性质');
  h+=inp(c+'_bus','Nature of business','业务性质');
  h+=txt(c+'_emp','Name & address of employer / business','雇主/公司名称及地址');
  h+=chk(c+'_noinc','No income','没有收入',1);
  if(!S[c+'_noinc'])h+=inp(c+'_inc','Annual earned income (RM)','年收入（令吉）','number');
  h+=sec('Address & contact','地址与联络');
  h+=inp(c+'_ra','Residential address','住家地址');
  h+='<div class="grid">'+inp(c+'_rpc','Postcode','邮政编码')+inp(c+'_rtown','Town','城镇')+inp(c+'_rst','State','州属')+inp(c+'_rcty','Country','国家')+'</div>';
  h+=chk(c+'_rco','Care-of (c/o) address','转交地址 (d/a)');
  h+=chk(c+'_same','Mailing address is the same as residential','邮寄地址与住家地址相同',1);
  if(!S[c+'_same']){h+=inp(c+'_ma','Mailing address','邮寄地址');h+='<div class="grid">'+inp(c+'_mpc','Postcode','邮政编码')+inp(c+'_mtown','Town','城镇')+inp(c+'_mst','State','州属')+inp(c+'_mcty','Country','国家')+'</div>';h+=chk(c+'_mco','Care-of (c/o) address','转交地址 (d/a)')}
  h+='<div class="grid">'+inp(c+'_hp','Mobile no. (H/P)','手机号码','tel','+60 ...')+inp(c+'_th','Tel. (House)','住家电话','tel')+inp(c+'_to','Tel. (Office)','办公室电话','tel')+'</div>';
  return h+'</div>';
}

/* ---------- steps ---------- */
var STEPS=[
 {t:'Start',f:function(){
  return '<div class="card"><h2>Welcome 欢迎</h2><p>This form collects the information needed for your insurance application. It only takes a few minutes.<small class="zh">此表格用于收集您投保所需的资料，只需几分钟。</small></p>'+
  '<div class="note">Please have your NRIC / passport ready. Your answers stay on this device until you choose to send them to your advisor.<small class="zh">请准备好身份证/护照。您的答案只会保存在此设备上，直到您选择发送给顾问。</small></div>'+
  sec('Who is involved?','涉及哪些人？')+
  chk('hasB','The Proposer (policy owner) is a different person from the Life to be Assured','投保人（保单持有人）与受保人不是同一人',1)+
  chk('hasC','Add Mother/Spouse of Proposer (usually for a child\'s policy)','增加投保人的母亲/配偶（通常用于儿童保单）',1)+
  '<p class="small">Yes/No answers in this form apply to everyone listed. 表格中的“是/否”答案适用于所有列出的人。</p>'+
  '<p><button class="btn s" type="button" onclick="if(confirm(\'Clear all answers and start a new form? 清除所有答案并开始新表格？\')){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+\'_p\')}catch(e){}location.reload()}">Start a new form 开始新表格</button></p></div>'}},
 {t:'Personal details',f:function(){return active().map(person).join('')}},
 {t:'Source of funds',f:function(){
  var opts=[['Employment related income e.g. salary, commission, bonus, EPF, pension','工作收入，如薪水、佣金、花红、公积金、退休金'],['Business income e.g. profits','生意收入，如盈利'],['Investment income e.g. shares, bonds, unit trust, rental','投资收入，如股票、债券、信托基金、租金'],['Policy claims, maturity or surrender','保单索赔、期满或退保'],['Savings or deposit','储蓄或存款'],['Others e.g. inheritance, gift, allowance, loan','其他，如遗产、礼物、津贴、贷款']];
  var h='<div class="card"><h2>Source of fund & wealth 资金与财富来源</h2><p class="small">To be completed by the policy owner. You may choose more than one. 由保单持有人填写，可多选。</p>';
  h+=sec('1. Source of funds used to pay the premium','1. 缴付保费的资金来源');
  opts.forEach(function(o,i){h+=chk('sf_'+i,o[0],o[1])});
  h+=sec('2. How did you accumulate your wealth (total assets)?','2. 您如何累积财富（总资产）？');
  opts.forEach(function(o,i){h+=chk('sw_'+i,o[0],o[1])});
  return h+txt('sf_other','Other details (if any)','其他说明（如有）')+'</div>'}},
 {t:'Insurance applied for',f:function(){
  var h='<div class="card"><h2>Life insurance applied for 投保详情</h2><div class="note">Your advisor will complete this part with you. 此部分由顾问与您一起填写。</div>';
  h+=rad('mode','Mode of payment','缴费方式',['Single','Yearly','Half-yearly','Quarterly','Monthly']);
  h+=rad('method','Method of payment','缴费途径',['Cash','Cheque','GIRO','Credit Card',"Banker's Order"]);
  h+=rad('despatch','Policy despatch method','保单寄送方式',['Electronic','Hardcopy']);
  h+=rad('dc','Credit any amount payable into my bank account (Direct Credit)?','是否将应付款项直接存入我的银行户口？',['Yes','No']);
  return h+'</div>'}},
 {t:'Existing insurance & lifestyle',f:function(){
  var ps=active().map(function(p){return p[0]}),h='<div class="card"><h2>Existing insurance 现有保险</h2>';
  h+=yn('ex1','Do you have any existing insurance, including those now proposed to other companies? (Life / Accident / Dread Disease / Disability / Medical / Health)','您是否有现有保险（包括正向其他公司申请的）？（人寿/意外/严重疾病/残障/医疗/健康）',ps,'Insurer, type, sum assured, year taken 保险公司、类别、保额、投保年份');
  h+=yn('ex2','Has any proposal / reinstatement / renewal on your life (incl. other companies) ever been declined, postponed, rated, restricted or modified or subject to additional terms?','您的任何保险申请/复效/续保是否曾被拒绝、延迟、加费、受限制或附加条件？',ps);
  h+=yn('ex3a','Is this proposal replacing or intended to replace any existing life policy with us or any other company?','此投保是否取代或打算取代任何现有人寿保单？',ps,'Which policy? 哪一份保单？');
  h+=yn('ex3b','Have you surrendered or terminated any existing life policy in the last 12 months, now to be replaced with this new policy?','过去12个月内是否曾退保或终止现有人寿保单，并由此新保单取代？',ps);
  h+=sec('Family history 家族病史','');
  h+=yn('fam','Have any of your biological parents, brothers or sisters ever suffered from heart disease, stroke, hypertension, diabetes, kidney disease, mental disorders, cancer, hereditary, neurological or congenital disease?','您的亲生父母、兄弟姐妹是否曾患心脏病、中风、高血压、糖尿病、肾病、精神疾病、癌症、遗传、神经系统或先天性疾病？',ps,'Who, which condition, age at diagnosis 谁、什么疾病、确诊年龄');
  h+=sec('Lifestyle 生活习惯','');
  h+=yn('smoke','Have you smoked or used any tobacco / nicotine product (cigarettes, cigar, pipe, vape) in the last 12 months?','过去12个月内您是否吸烟或使用任何烟草/尼古丁产品？',ps,'Number of cigarettes/cigars per day 每天几支');
  h+=yn('alc','Do you consume alcoholic drinks?','您是否饮酒？',ps,'Average weekly: beer/stout (small bottles), wine (glasses), whisky/brandy (pegs), social 每周平均：啤酒/黑啤（小瓶）、红酒（杯）、威士忌/白兰地（杯）、社交性');
  return h+'</div>'}},
 {t:'Health',f:function(){
  var ps=active().map(function(p){return p[0]});
  var fem=ps.filter(function(c){return S[c+'_sex']==='Female'});
  var h='<div class="card"><h2>Health details 健康资料</h2><div class="note">Please answer honestly and completely. If Yes, give full details (condition, when, treatment, doctor/hospital, recovery). 请如实完整作答。如回答“是”，请提供详情（病况、时间、治疗、医生/医院、康复情况）。</div>';
  h+=yn('h3','Are you currently receiving medical treatment and/or suffering from physical impairment, infirmity or congenital abnormality?','您目前是否正在接受治疗，或有身体残障、虚弱或先天异常？',ps);
  h+=yn('h4','Have you ever taken (or now take) drugs or narcotics other than those validly prescribed by doctors, or been treated for drug habits?','您是否曾/正在服用非医生处方的药物或毒品，或曾接受戒毒治疗？',ps);
  h+=sec('5. Have you ever had, been diagnosed with, investigated, treated for, or advised to seek medical/surgical treatment for…','5. 您是否曾患有、被诊断、检查、治疗或被建议接受治疗：');
  var q5=[
  ['a','Stroke, TIA, brain haemorrhage/injury, epilepsy, fits, paralysis, Parkinson\'s, Alzheimer\'s, multiple sclerosis, prolonged recurrent dizziness or headache, migraine, cerebral palsy, or other brain / nervous system disorder?','中风、短暂性脑缺血、脑出血/受伤、癫痫、抽搐、瘫痪、帕金森、阿尔茨海默、多发性硬化、长期反复头晕/头痛、偏头痛、脑瘫或其他脑/神经系统疾病？'],
  ['b','Depression, anxiety, schizophrenia, suicide attempt, ADHD, autism, Down\'s syndrome, dementia, or any other mental health / psychiatric illness?','抑郁、焦虑、精神分裂、自杀企图、过动症、自闭症、唐氏综合症、痴呆或其他精神/心理疾病？'],
  ['c','Asthma, bronchitis, tuberculosis (TB), pneumonia, coughing blood, or any other lung / respiratory disorder?','哮喘、支气管炎、肺结核、肺炎、咳血或其他肺部/呼吸系统疾病？'],
  ['d','Chest pain, angina, palpitation, irregular heartbeat, coronary artery disease, heart attack, raised cholesterol, high or low blood pressure, heart valve disorder, enlarged heart, congenital heart defects/surgery, deep vein thrombosis, varicose veins, or other heart / vascular disorder?','胸痛、心绞痛、心悸、心律不齐、冠心病、心脏病发作、胆固醇高、高/低血压、心瓣膜疾病、心脏肥大、先天性心脏缺陷/手术、深静脉血栓、静脉曲张或其他心脏/血管疾病？'],
  ['e','Diabetes, abnormal blood sugar, thyroid disease, goiter, thalassemia, anaemia, haemophilia, or other endocrine / blood / chromosomal / hereditary disorder?','糖尿病、血糖异常、甲状腺疾病、甲状腺肿、地中海贫血、贫血、血友病或其他内分泌/血液/染色体/遗传疾病？'],

function setupSig(){
  document.querySelectorAll('canvas[data-sig]').forEach(function(cv){
    var c=cv.dataset.sig,r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    var g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
    if(S['sig_'+c]){var im=new Image();im.onload=function(){g.drawImage(im,0,0,r.width,r.height)};im.src=S['sig_'+c]}
    var down=false,last;
    function pt(e){var b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
    cv.addEventListener('pointerdown',function(e){down=true;last=pt(e);cv.setPointerCapture(e.pointerId);g.beginPath();g.arc(last[0],last[1],1,0,6.3);g.fill();e.preventDefault()});
    cv.addEventListener('pointermove',function(e){if(!down)return;var p=pt(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;e.preventDefault()});
    function up(){if(!down)return;down=false;try{S['sig_'+c]=cv.toDataURL('image/png');save()}catch(e){}}
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  });
  document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){var c=b.dataset.clear;delete S['sig_'+c];save();render(true)}});
  var s=document.getElementById('send'),d=document.getElementById('dl');
